# Render Blueprint Specification for Mus3o
# https://render.com/docs/blueprint-spec
#
# Dos servicios: la API (Express + Claude) y el frontend como Static Site (CDN, gratis).
# El frontend llama a la API con rutas relativas (/api/...); el rewrite las reenvía a mus3o-api.
# Si cambias el nombre "mus3o-api", actualiza el destination del rewrite.
services:
  # API
  - type: web
    name: mus3o-api
    runtime: node
    plan: starter # $7/month (Active 24/7, No cold starts, 512MB RAM, 0.5 vCPU)
    region: oregon
    branch: main
    # El repo usa pnpm (pnpm-lock.yaml + .npmrc con link-workspace-packages); ya no hay package-lock.json.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mus3o/shared build && pnpm --filter @mus3o/server build && pnpm --filter @mus3o/web build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: MAX_DAILY_GENERATIONS
        value: "200"
      - key: ANTHROPIC_API_KEY
        sync: false

  # Frontend 3D
  - type: web
    name: mus3o
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mus3o/shared build && pnpm --filter @mus3o/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mus3o-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
